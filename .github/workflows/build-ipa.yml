
name: Build Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project EudiReferenceWallet.xcodeproj \
            -scheme "EUDI Wallet Dev"

      - name: Build Unsigned App
        run: |
          xcodebuild \
            -project EudiReferenceWallet.xcodeproj \
            -scheme "EUDI Wallet Dev" \
            -configuration "Debug Dev" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Debug Dev-iphoneos/EUDI Wallet Dev.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Application bundle not found!"
            find "build/Build/Products" -maxdepth 3 -name "*.app"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload EUDIWalletDev.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EUDIWalletDev-IPA
          path: EUDIWalletDev.ipa
          if-no-files-found: error
          retention-days: 7
