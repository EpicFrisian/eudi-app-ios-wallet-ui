
      - name: Inspect Xcode project
        run: |
          xcodebuild -version
          xcodebuild -list -project EudiReferenceWallet.xcodeproj

      - name: Build Unsigned App
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project EudiReferenceWallet.xcodeproj \
            -scheme "EUDI Wallet Dev" \
            -configuration "Debug Dev" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -verbose \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log

      - name: Show build errors
        if: always()
        run: |
          echo "========== XCODE ERRORS =========="
          grep -inE \
            'error:|failed|unable to|cycle|duplicate|not found|missing package' \
            build.log | tail -100 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Logs
          path: build.log
          if-no-files-found: ignore
